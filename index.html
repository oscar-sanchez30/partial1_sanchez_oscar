    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px;
            color: #030303;
            background: #7b7676;
        }

        h2 a {
            color: #6a1b9a;
            font-size: 22px;
            text-decoration: none;
            font-weight: bold;
        }

        h2 a:hover {
            text-decoration: underline;
        }


        /* =========================
           TÍTULOS
        ========================= */

        h3 {
            font-size: 18px;
            margin-top: 25px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: 25px auto;
        }

        .menu button {
            width: 320px;
            max-width: 90%;

            border: none;
            border-radius: 8px;

            background: #333;
            color: white;

            padding: 13px 18px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .menu button:hover {
            background: #6a1b9a;
            transform: scale(1.03);
        }

        .student {
            background: white;

            width: 500px;
            max-width: 95%;

            margin: 45px auto;

            padding: 35px 25px;

            border-radius: 18px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .profile-image {
            width: 400px;
            height: 400px;

            max-width: 100%;

            object-fit: cover;

            border-radius: 50%;

            border: 5px solid white;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.25);

            display: block;

            margin: 0 auto 25px auto;

            transition: 0.3s;
        }

        .profile-image:hover {
            transform: scale(1.02);
        }

        .student h3 {
            color: #666;
            font-size: 17px;
            margin-bottom: 10px;
        }

        .student h1 {
            font-size: 27px;
            margin: 10px 0;
            color: #222;
        }

        .student p {
            color: #666;
            font-size: 15px;
            word-break: break-word;
        }
        .diagram {
            margin: 30px auto;

            padding: 20px;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.10);
        }

        .diagram h2 {
            color: #333;
            margin-bottom: 20px;
        }

        iframe {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: white;
        }


        /* =========================
           BOTÓN VOLVER
        ========================= */

        .back {
            display: inline-block;

            margin: 25px;

            padding: 10px 20px;

            color: white;

            background: #6a1b9a;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;

            text-decoration: none;

            transition: 0.3s;
        }

        .back:hover {
            background: #4a126d;
            transform: scale(1.03);
        }

        .hidden {
            display: none;
        }


        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .profile-image {
                width: 280px;
                height: 280px;
            }

            .student h1 {
                font-size: 21px;
            }

            .menu button {
                width: 280px;
            }

            .diagram {
                padding: 10px;
            }
        }
    </style>
</head>
